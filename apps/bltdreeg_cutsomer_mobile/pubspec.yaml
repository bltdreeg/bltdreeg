name: bltdreeg_cutsomer_mobile
description: "Beltadreeg (بالتدريج) — customer app for live barbershop queues and bookings."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0

  # Navigation & DI
  go_router: ^18.0.1
  get_it: ^9.2.1

  # Data
  dio: ^5.11.1
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  connectivity_plus: ^7.3.1

  # UI / platform
  flutter_svg: ^2.3.0
  intl: ^0.20.3
  url_launcher: ^6.3.2
  stream_transform: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/
    - assets/illustrations/
    - assets/illustrations/onboarding_choose_barber/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/cairo/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/cairo/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/cairo/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/cairo/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/cairo/Cairo-ExtraBold.ttf
          weight: 800
