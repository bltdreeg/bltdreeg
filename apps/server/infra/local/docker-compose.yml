name: bltdreeg

services:
  traefik:
    image: traefik:v3.6
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.constraints=Label(`com.docker.compose.project`,`bltdreeg`)
      - --entrypoints.web.address=:80
      - --api.insecure=true
    ports:
      - "8085:80"
      - "8086:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: bltdreeg
      MYSQL_USER: bltdreeg
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  central:
    build:
      context: ./php
    image: bltdreeg/php:8.3
    working_dir: /var/www/html
    command: php artisan serve --host=0.0.0.0 --port=8000
    volumes:
      - ../../central-app:/var/www/html
      - central-vendor:/var/www/html/vendor
      - ../../packages:/var/www/packages
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    labels:
      - traefik.enable=true
      - traefik.http.routers.central.rule=Host(`admin.localhost`)
      - traefik.http.services.central.loadbalancer.server.port=8000

  tenant:
    build:
      context: ./php
    image: bltdreeg/php:8.3
    working_dir: /var/www/html
    command: php artisan serve --host=0.0.0.0 --port=8000
    volumes:
      - ../../tenant-app:/var/www/html
      - tenant-vendor:/var/www/html/vendor
      - ../../packages:/var/www/packages
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    labels:
      - traefik.enable=true
      - traefik.http.routers.tenant.rule=Host(`app.localhost`)
      - traefik.http.services.tenant.loadbalancer.server.port=8000

  composer-central:
    build:
      context: ./php
    image: bltdreeg/php:8.3
    profiles: ["tools"]
    working_dir: /app
    volumes:
      - ../../central-app:/app
      - central-vendor:/app/vendor
      - ../../packages:/packages

  composer-tenant:
    build:
      context: ./php
    image: bltdreeg/php:8.3
    profiles: ["tools"]
    working_dir: /app
    volumes:
      - ../../tenant-app:/app
      - tenant-vendor:/app/vendor
      - ../../packages:/packages

volumes:
  mysql-data:
  central-vendor:
  tenant-vendor:
