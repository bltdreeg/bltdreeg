name: bltdreeg-server

x-app: &app
  build:
    context: ./php
    dockerfile: Dockerfile
  restart: unless-stopped
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "php -r \"exit(@file_get_contents('http://127.0.0.1:8000/up')===false?1:0);\""]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 180s
  environment: &app-env
    APP_ENV: local
    APP_LOCALE: ar
    APP_DEBUG: "true"
    OCTANE_SERVER: frankenphp
    AUTH_MODEL: Bltdreeg\Core\Modules\Auth\Models\User
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: "3306"
    DB_DATABASE: bltdreeg_server
    DB_USERNAME: root
    DB_PASSWORD: secret
    REDIS_CLIENT: phpredis
    REDIS_HOST: redis
    REDIS_PORT: "6379"

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: bltdreeg_server
      MYSQL_USER: bltdreeg
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3308:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6382:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  tenant-app:
    <<: *app
    working_dir: /workspace/tenant-app
    ports:
      - "8010:8000"
    environment:
      <<: *app-env
      APP_NAME: "Bltdreeg Tenant"
      APP_URL: http://localhost:8010
    volumes:
      - ../..:/workspace
      - tenant-vendor:/workspace/tenant-app/vendor
      - tenant-node-modules:/workspace/tenant-app/node_modules
      - composer-cache:/root/.composer/cache

  central-app:
    <<: *app
    working_dir: /workspace/central-app
    ports:
      - "8011:8000"
    environment:
      <<: *app-env
      APP_NAME: "Bltdreeg Central"
      APP_URL: http://localhost:8011
    volumes:
      - ../..:/workspace
      - central-vendor:/workspace/central-app/vendor
      - central-node-modules:/workspace/central-app/node_modules
      - composer-cache:/root/.composer/cache

volumes:
  mysql-data:
  composer-cache:
  tenant-vendor:
  tenant-node-modules:
  central-vendor:
  central-node-modules:
